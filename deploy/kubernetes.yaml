apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-workflow-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-workflow-engine
  template:
    metadata:
      labels:
        app: ai-workflow-engine
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: api
          image: ai-workflow-engine:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8000
